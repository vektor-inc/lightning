name: PHP Unit Test

on:
  pull_request:
    branches:
      - master
      - develop
    types: [opened, reopened, labeled, synchronize]

# 同じ PR に対する run は 1 つだけ残し、古い run は取り消す。
# Dependabot は PR 作成直後に dependencies / php などのラベルを次々付け、
# そのたびに run が作られるため、取り消さないと同じ内容を何度もテストしてしまう。
concurrency:
  group: php-unit-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  php_unit:
    name: php unittest
    # Dependabot の PR は run-ci ラベル無しでも実行する。
    # dependabot-auto-merge-complete.yml がこの結果を見てマージするため。
    #
    # labeled のときも除外しない。master の必須ステータスチェック「php unittest (7.4)」は
    # このワークフローの最新の run で判定されるため、Dependabot がラベルを付けたときの run を
    # skip にすると、成功した run があっても最新 run に該当ジョブが無く「待機中」のまま
    # マージできなくなる。重複起動は上の concurrency で古い run を取り消して抑える。
    if: >-
      contains(github.event.pull_request.labels.*.name, 'run-ci') ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [7.4, 8.0, 8.1]
    services:
      mysql:
        image: mysql:5.7
        ports:
          - 3306
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v1
        with:
          node-version: 20.x
      - name: Cache multiple paths
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: install npm scripts
        run: npm install
      - name: install Composer dependencies
        run: composer install
      - name: Build
        run: npm run build
      - name: wp-env start
        run: ./node_modules/@wordpress/env/bin/wp-env start
      - name: install composer
        run: ./node_modules/@wordpress/env/bin/wp-env run cli --env-cwd=wp-content/themes/lightning composer install
      - name: Change file permission
        run: |
          umask
          sudo chmod -R 777 ./
          sudo chmod -R 777 ~/wp-env
      - name: php unit test root
        run: ./node_modules/@wordpress/env/bin/wp-env run --env-cwd='wp-content/themes/lightning' tests-cli vendor/bin/phpunit -c phpunit.root.xml --testdox
      - name: php unit test G2
        run: ./node_modules/@wordpress/env/bin/wp-env run --env-cwd='wp-content/themes/lightning' tests-cli vendor/bin/phpunit -c phpunit.g2.xml --testdox
      - name: php unit test G3
        run: ./node_modules/@wordpress/env/bin/wp-env run --env-cwd='wp-content/themes/lightning' tests-cli vendor/bin/phpunit -c phpunit.g3.xml --testdox
